name: Acig

on:
  pull_request:

jobs:
  acig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        if: ${{ vars.ACIG_APP_ID != '' }}
        with:
          app-id: ${{ vars.ACIG_APP_ID }}
          private-key: ${{ secrets.ACIG_APP_PRIVATE_KEY }}

      - name: Install acig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACIG_VERSION=$(gh release view --repo helloodokai/acig --json tagName --jq '.tagName' 2>/dev/null || echo "")
          if [ -z "$ACIG_VERSION" ]; then
            echo "::error::could not determine latest acig version"
            exit 1
          fi
          echo "Using ACIG version ${ACIG_VERSION}"

          gh release download "${ACIG_VERSION}" --repo helloodokai/acig -p "checksums.txt" -p "acig_linux_amd64.tar.gz" -D /tmp

          cd /tmp
          EXPECTED=$(grep "acig_linux_amd64.tar.gz" checksums.txt | awk '{print $1}')
          if [ -z "$EXPECTED" ]; then
            echo "::error::checksums.txt does not contain acig_linux_amd64.tar.gz"
            cat checksums.txt
            exit 1
          fi
          ACTUAL=$(sha256sum acig_linux_amd64.tar.gz | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::checksum mismatch: expected $EXPECTED got $ACTUAL"
            exit 1
          fi

          tar xz -f acig_linux_amd64.tar.gz -C /usr/local/bin acig

      - name: Run acig
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          acig run --format both --out acig-verdict --profile cloud --pr "${{ github.event.pull_request.number }}" --sha "${{ github.event.pull_request.head.sha }}" || exit_code=$?
          if [ "${exit_code:-0}" -ge 2 ]; then
            echo "acig: BLOCKED — blocking findings present"
            exit 1
          fi
          echo "acig: passed (exit code ${exit_code:-0})"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acig-verdict
          path: acig-verdict.json