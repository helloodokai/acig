name: Acig

on:
  pull_request:

jobs:
  acig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install acig
        run: |
          curl -sSL https://github.com/helloodokai/acig/releases/latest/download/acig_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin acig
      - name: Run acig
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          acig run --format both --out acig-verdict --profile cloud --pr "${{ github.event.pull_request.number }}" || exit_code=$?
          if [ "${exit_code:-0}" -ge 2 ]; then
            echo "acig: BLOCKED — blocking findings present"
            exit 1
          fi
          echo "acig: passed (exit code ${exit_code:-0})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acig-verdict
          path: acig-verdict.json