version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: acig
    main: ./cmd/acig/main.go
    binary: acig
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: acig
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - repository:
      owner: helloodokai
      name: tap
    directory: Casks
    homepage: "https://github.com/helloodokai/acig"
    description: "Agentic CI Gateway - tiered code review via cheap critics + frontier adjudication"
    binaries: [acig]
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/acig"]
          end

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"